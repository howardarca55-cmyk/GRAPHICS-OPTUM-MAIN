<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – Verify Code</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot.css') }}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- ── Header ── -->
    <header>
        <a href="#" class="logo">Brand<span>.</span></a>

        <input type="checkbox" id="toggler">
        <label for="toggler" class="fa-solid fa-bars"></label>

        <nav class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <div class="icons">
            <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="#"><i class="fa-solid fa-user"></i></a>
        </div>
    </header>

    <!-- ── Main Section ── -->
<section class="home">
    <div class="wrapper">
        <div class="form-box">

            <h2>Verify Code</h2>

            <p class="code-hint">
                Enter the verification code sent to your registered email address.
            </p>

            {% if error %}
            <div style="
                background: rgba(220,20,60,0.12);
                border: .1rem solid rgba(220,20,60,0.35);
                color: #ff8a8a;
                padding: 1.2rem 1.6rem;
                border-radius: .6rem;
                font-size: 1.35rem;
                margin-bottom: 2rem;
                display: flex;
                align-items: center;
                gap: 1rem;
            ">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div style="
                background: rgba(0,200,150,0.1);
                border: .1rem solid rgba(0,200,150,0.3);
                color: #5fffd6;
                padding: 1.2rem 1.6rem;
                border-radius: .6rem;
                font-size: 1.35rem;
                margin-bottom: 2rem;
                display: flex;
                align-items: center;
                gap: 1rem;
            ">
                <i class="fas fa-check-circle"></i> {{ success }}
            </div>
            {% endif %}

            <!-- Step 1: Email (hidden after code is sent) -->
            {% if not code_sent %}
            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="input-box">
                    <input type="email" name="email" id="email" required autocomplete="email">
                    <label for="email">Registered Email Address</label>
                    <i class="fa-solid fa-envelope icon"></i>
                </div>
                <button type="submit" class="btn">Send Code</button>
            </form>
            {% else %}

            <!-- Step 2: Code input only (like your screenshot) -->
            <form action="{{ url_for('verify_code') }}" method="POST">
                <div class="input-box">
                    <input type="text"
                           name="verification_code"
                           id="verification_code"
                           maxlength="6"
                           autocomplete="one-time-code"
                           required>
                    <label for="verification_code">Type Verification Code Here</label>
                    <i class="fa-solid fa-shield-halved icon"></i>
                </div>
                <button type="submit" class="btn">Verify</button>
            </form>
            {% endif %}

            <div class="login-register">
                <p>Remembered your password? <a href="{{ url_for('login') }}">Back to Login</a></p>
            </div>

        </div>
    </div>
</section>
